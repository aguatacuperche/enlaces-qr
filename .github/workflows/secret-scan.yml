name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # Versión pinneada. Dependabot (ecosistema github-actions) avisa de bumps;
          # al subir versión, el paso de verificación de abajo sigue cubriendo.
          GITLEAKS_VERSION=8.18.4
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf "${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          curl -sSLf "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks.checksums
          # Verifica el tarball contra el checksum publicado en el release (evita
          # que el job de seguridad confíe a ciegas en un binario descargado).
          EXPECTED=$(grep 'linux_x64.tar.gz' /tmp/gitleaks.checksums | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then echo "no se encontró checksum para linux_x64"; exit 1; fi
          echo "${EXPECTED}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
